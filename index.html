<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#1F5A3A">
<title>Semira Faktura</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.bad{color:var(--bad);font-weight:700}
</style>
<link rel="stylesheet" href="style.css">
<script src="nav.js" defer></script>
</head>
<body>
<main>
<p class="hello">Herzlich willkommen,<br><strong id="nm">Semira Faktura</strong></p>
<p id="sich" class="bad" hidden></p>
<a class="card stat" href="rechnungen.html?f=alle"><b id="gesamt">0</b>Rechnungen gesamt</a>
<div class="two">
  <a class="card stat" href="rechnungen.html?f=erledigt"><b id="erl">0</b>Erledigt</a>
  <a class="card stat" href="rechnungen.html?f=offen"><b id="off">0</b>Offen</a>
</div>
<p id="ueb" class="bad" hidden></p>
<a class="btn big" href="rechnung.html">Neue Rechnung +</a>
<a class="btn sec big" href="stundenzettel.html">Stundenzettel erfassen</a>
</main>
<script>
const $ = id => document.getElementById(id);
const rd = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const fmt = n => n.toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const md = rd('meineDaten'); if (md && md.mName) $('nm').textContent = md.mName + '!';
const l = rd('rechnungen') || [];
const offen = l.filter(r => r.status !== 'erledigt');
$('gesamt').textContent = l.length; $('erl').textContent = l.length - offen.length; $('off').textContent = offen.length;
const p = s => { const m = String(s || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const h = new Date(); h.setHours(0, 0, 0, 0);
const ue = offen.filter(r => { const f = p(r.faellig); return f && f < h; });
if (ue.length) { $('ueb').hidden = false; $('ueb').innerHTML = ue.length + ' überfällig (' + fmt(ue.reduce((a, r) => a + (r.summe || 0), 0)) + ' €) · <a href="rechnungen.html?f=offen">ansehen</a>'; }
const K = ['stundenzettel', 'meineDaten', 'rechnungen', 'adressbuch'];
const z = K.map(k => localStorage.getItem(k) || '').join('|');
const hs = s => { let x = 5381; for (let j = 0; j < s.length; j++) x = ((x << 5) + x + s.charCodeAt(j)) | 0; return String(x); };
const inf = rd('sicherungInfo');
if (z.replace(/\|/g, '') !== '' && (!inf || inf.hash !== hs(z))) { $('sich').hidden = false; $('sich').innerHTML = 'Ungesicherte Änderungen. <a href="sicherung.html">Jetzt sichern</a>'; }
</script>
</body>
</html>
